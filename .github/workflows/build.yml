# .github/workflows/build.yml

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev

      - name: Check out JUCE
        run: git clone --depth 1 --branch 9.0.1 https://github.com/juce-framework/JUCE ../JUCE

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVALIS_JUCE_DIR=../JUCE

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Render the proof of concept
        run: |
          ./build/valis_render_artefacts/Debug/valis_render examples/skream.ttl \
            -o /tmp/skream.wav --tone 100 --seconds 1
